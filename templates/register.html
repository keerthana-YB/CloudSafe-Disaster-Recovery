
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CloudSafe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101a3a, #5636a5);
        }

        .register-box {
            width: 380px;
            max-width: 90%;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #26346b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #6545c5;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #6044bd;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #49319b;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        a {
            color: #6044bd;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            background: #ffe8e8;
            color: #a22;
            border-radius: 6px;
        }

        .success {
            background: #e5f8e9;
            color: #176b30;
        }
    </style>
</head>

<body>
    <div class="register-box">

        <h1>CloudSafe</h1>
        <p class="subtitle">Create your secure account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter your username" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create a password (minimum 8 characters)"
                   minlength="8" required>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>
</body>
</html>
